name: One-time repository repair

on:
  push:
    branches: ['chore/portfolio-repair']
    paths:
      - 'scripts/repair-repository.mjs'
      - '.github/workflows/one-time-repository-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: chore/portfolio-repair

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Normalize source and remove archived directories
        run: node scripts/repair-repository.mjs

      - name: Commit normalized repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes were required."
            exit 0
          fi
          git commit -m "chore: normalize portfolio source and archive legacy apps"
          git push origin HEAD:chore/portfolio-repair
