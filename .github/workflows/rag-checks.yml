name: RAG checks

on:
  pull_request:
    paths:
      - 'data/portfolio-index.json'
      - 'js/main.js'
      - 'js/rag-search.js'
      - 'js/rag-search.test.js'
      - 'babel.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rag-checks.yml'
  push:
    branches:
      - feature/rag-semantic-search
    paths:
      - 'data/portfolio-index.json'
      - 'js/main.js'
      - 'js/rag-search.js'
      - 'js/rag-search.test.js'
      - 'babel.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rag-checks.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run retrieval tests
        run: npm test -- --runInBand

      - name: Build production site
        run: npm run build
