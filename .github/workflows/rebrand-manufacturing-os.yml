name: Rebrand Manufacturing Project

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebrand-manufacturing-os.yml'

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebrand manufacturing project
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          project = Path('project.html')
          text = project.read_text()
          replacements = {
              '<!-- Project 3: Manufacturing DBMS -->': '<!-- Project 3: Manufacturing Intelligence OS -->',
              'data-category="web backend"': 'data-category="ml web backend"',
              'alt="Manufacturing Database Management System"': 'alt="Manufacturing Intelligence OS for factories"',
              '<span\n                class="px-3 py-1.5 bg-emerald-500/90 text-white text-xs rounded-full font-medium backdrop-blur-sm"\n                >Backend</span': '<span\n                class="px-3 py-1.5 bg-emerald-500/90 text-white text-xs rounded-full font-medium backdrop-blur-sm"\n                >Backend</span\n              ><span\n                class="px-3 py-1.5 bg-violet-500/90 text-white text-xs rounded-full font-medium backdrop-blur-sm"\n                >AI</span',
              '<h3 class="text-lg font-semibold mb-2 text-white">Manufacturing Database System</h3>': '<h3 class="text-lg font-semibold mb-2 text-white">Manufacturing Intelligence OS for Factories</h3>',
              'MDBMS-HTML is a front-end for a Manufacturing DBMS - interactive and fully responsive.': 'An AI-native manufacturing intelligence platform for factories, combining operational data, analytics, and natural-language access to factory information.',
              '<span class="badge text-orange-400 border-orange-500/30 bg-orange-500/10">HTML</span>\n              <span class="badge text-indigo-400 border-indigo-500/30 bg-indigo-500/10">CSS</span>\n              <span class="badge text-amber-400 border-amber-500/30 bg-amber-500/10"\n                >JavaScript</span': '<span class="badge text-blue-400 border-blue-500/30 bg-blue-500/10">PostgreSQL</span>\n              <span class="badge text-emerald-400 border-emerald-500/30 bg-emerald-500/10">Supabase</span>\n              <span class="badge text-violet-400 border-violet-500/30 bg-violet-500/10"\n                >RAG / LLM</span',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected text: {old[:80]!r}')
              text = text.replace(old, new, 1)
          project.write_text(text)

          index = Path('data/portfolio-index.json')
          data = json.loads(index.read_text())
          for doc in data['documents']:
              if doc.get('id') == 'project-manufacturing-dbms':
                  doc['title'] = 'Manufacturing Intelligence OS for Factories'
                  doc['description'] = 'AI-native manufacturing intelligence platform that turns factory operational data into searchable, actionable intelligence.'
                  doc['content'] = 'Manufacturing Intelligence OS for factories, evolving the original manufacturing database workflow into an integrated operational data and intelligence platform with analytics and natural-language access to factory information.'
                  doc['sourceLabel'] = 'Project · Manufacturing Intelligence'
                  doc['tags'] = ['manufacturing', 'factory intelligence', 'AI', 'RAG', 'LLM', 'operations', 'analytics', 'database', 'PostgreSQL', 'Supabase']
                  break
          else:
              raise SystemExit('Manufacturing project document not found')
          index.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Commit changes to a review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project.html data/portfolio-index.json
          git rm .github/workflows/rebrand-manufacturing-os.yml
          git commit -m "Rebrand manufacturing project as Manufacturing Intelligence OS"
          git push origin HEAD:rebrand/manufacturing-intelligence-os
